x-api-runtime: &api-runtime
  image: ticketforge-api:local
  restart: unless-stopped
  environment: &api-environment
    SERVER_PORT: 8080
    DB_URL: jdbc:postgresql://postgres:5432/ticketforge
    DB_USERNAME: postgres
    DB_PASSWORD: postgres
    REDIS_HOST: redis
    REDIS_PORT: 6379
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    JWT_SECRET: ${JWT_SECRET:-1234567890123456789012345678901234567890123456789012345678901234}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
    interval: 10s
    timeout: 5s
    start_period: 20s
    retries: 6

services:
  postgres:
    image: postgres:16
    container_name: ticketforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticketforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticketforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: ticketforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.0.0
    container_name: ticketforge-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 10

  api1:
    <<: *api-runtime
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: ticketforge-api-1
    ports:
      - "8081:8080"

  api2:
    <<: *api-runtime
    container_name: ticketforge-api-2
    ports:
      - "8082:8080"

  api3:
    <<: *api-runtime
    container_name: ticketforge-api-3
    ports:
      - "8083:8080"

  api-gateway:
    image: nginx:1.27-alpine
    container_name: ticketforge-api-gateway
    restart: unless-stopped
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
      api3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    image: ticketforge-frontend:local
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.frontend
    container_name: ticketforge-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  postgres-data:
    name: ticketforge-postgres-data
