services:

  postgres:
    image: postgres:16
    container_name: ticketforge-postgres
    environment:
      POSTGRES_DB: ticketforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"


  api1:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: ticketforge-api-1
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/ticketforge
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8081:8080"
    depends_on:
      - postgres
      - redis

  api2:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: ticketforge-api-2
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/ticketforge
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8082:8080"
    depends_on:
      - postgres
      - redis

  api3:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: ticketforge-api-3
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/ticketforge
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8083:8080"
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:latest
    container_name: ticketforge-nginx
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "8080:80"
    depends_on:
      - api1
      - api2
      - api3


  redis:
    image: redis:7
    container_name: ticketforge-redis
    ports:
      - "6379:6379"