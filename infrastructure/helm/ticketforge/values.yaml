environment: development
nameOverride: ""
fullnameOverride: ticketforge

api:
  enabled: true
  replicaCount: 3
  image:
    repository: ticketforge-api
    tag: sprint-19
    pullPolicy: IfNotPresent
  port: 8080
  existingSecret: ticketforge-api-secret
  resources:
    requests: { cpu: 500m, memory: 256Mi }
    limits: { cpu: 750m, memory: 768Mi }
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    scaleDownStabilizationSeconds: 120
  disruptionBudget:
    enabled: true
    minAvailable: 2

frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: ticketforge-frontend
    tag: sprint-20-networking-v2
    pullPolicy: IfNotPresent
  port: 8080
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

config:
  serverPort: "8080"
  dbUrl: jdbc:postgresql://postgres:5432/ticketforge
  redisHost: redis
  redisPort: "6379"
  kafkaBootstrapServers: kafka:9092

gateway:
  enabled: true
  className: nginx
  hostname: ""
  tls:
    enabled: false
    secretName: ""

networkPolicy:
  enabled: true

