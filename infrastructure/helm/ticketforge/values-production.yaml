environment: production

api:
  replicaCount: 5
  image:
    repository: ghcr.io/lc443/ticketforge-api
    tag: replace-with-immutable-release
    pullPolicy: IfNotPresent
  autoscaling:
    minReplicas: 5
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60
    scaleDownStabilizationSeconds: 300
  disruptionBudget:
    minAvailable: 4

frontend:
  image:
    repository: ghcr.io/lc443/ticketforge-frontend
    tag: replace-with-immutable-release
    pullPolicy: IfNotPresent

gateway:
  hostname: ticketforge.example.com
  tls:
    enabled: true
    secretName: ticketforge-tls

