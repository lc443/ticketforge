{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "ticketforge.fullname" . }}-frontend-test
  labels:
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.37
      command: ["wget", "-qO-", "http://{{ include "ticketforge.fullname" . }}-frontend/health"]
      resources:
        requests: { cpu: 5m, memory: 8Mi }
        limits: { cpu: 25m, memory: 16Mi }
{{- end }}

