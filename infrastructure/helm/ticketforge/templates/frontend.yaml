{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ticketforge.fullname" . }}-frontend
  labels:
    {{- include "ticketforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector: { matchLabels: { app.kubernetes.io/name: {{ include "ticketforge.fullname" . }}-frontend } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ include "ticketforge.fullname" . }}-frontend, app.kubernetes.io/component: web, app.kubernetes.io/part-of: ticketforge }
    spec:
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: frontend
          image: {{ printf "%s:%s" .Values.frontend.image.repository .Values.frontend.image.tag | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports: [{ name: http, containerPort: {{ .Values.frontend.port }} }]
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10 }
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ticketforge.fullname" . }}-frontend
spec:
  selector: { app.kubernetes.io/name: {{ include "ticketforge.fullname" . }}-frontend }
  ports: [{ name: http, port: 80, targetPort: http }]
{{- end }}

