apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ticketforge.fullname" . }}-api-config
  labels:
    {{- include "ticketforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
data:
  SERVER_PORT: {{ .Values.config.serverPort | quote }}
  DB_URL: {{ .Values.config.dbUrl | quote }}
  REDIS_HOST: {{ .Values.config.redisHost | quote }}
  REDIS_PORT: {{ .Values.config.redisPort | quote }}
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.config.kafkaBootstrapServers | quote }}

