apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketforge-api
  namespace: ticketforge
  labels:
    app.kubernetes.io/name: ticketforge-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: ticketforge
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ticketforge-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ticketforge-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: ticketforge
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.37
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - until nc -z postgres 5432 && nc -z redis 6379 && nc -z kafka 9092; do echo "waiting for dependencies"; sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: api
          image: ticketforge-api:k8s
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ticketforge-api-config
            - secretRef:
                name: ticketforge-api-secret
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ticketforge-api
  namespace: ticketforge
  labels:
    app.kubernetes.io/name: ticketforge-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: ticketforge
spec:
  selector:
    app.kubernetes.io/name: ticketforge-api
  ports:
    - name: http
      port: 8080
      targetPort: http
