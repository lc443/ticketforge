apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ticketforge-gateway
  namespace: ticketforge
  labels:
    app.kubernetes.io/name: ticketforge-gateway
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: ticketforge
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ticketforge
  namespace: ticketforge
  labels:
    app.kubernetes.io/name: ticketforge
    app.kubernetes.io/component: routing
    app.kubernetes.io/part-of: ticketforge
spec:
  parentRefs:
    - name: ticketforge-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: ticketforge-api
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ticketforge-frontend
          port: 80

