apiVersion: v1
kind: Secret
metadata:
  name: ticketforge-api-secret
  namespace: ticketforge
  labels:
    app.kubernetes.io/name: ticketforge-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: ticketforge
type: Opaque
stringData:
  DB_USERNAME: replace-with-local-database-username
  DB_PASSWORD: replace-with-local-database-password
  JWT_SECRET: replace-with-at-least-64-random-characters
