apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketforge-api
  namespace: ticketforge
spec:
  replicas: 5
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ticketforge-api
  namespace: ticketforge
spec:
  minAvailable: 4

