apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ticketforge-api
  namespace: ticketforge
spec:
  minReplicas: 5
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

