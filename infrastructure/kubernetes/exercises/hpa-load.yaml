apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hpa-load-to-api
  namespace: ticketforge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ticketforge-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              run: hpa-load
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: hpa-load
  namespace: ticketforge
  labels:
    run: hpa-load
spec:
  restartPolicy: Never
  containers:
    - name: load
      image: busybox:1.37
      command:
        - sh
        - -c
        - for worker in $(seq 1 80); do while true; do wget -q -O /dev/null http://ticketforge-api:8080/actuator/health; done & done; wait
      resources:
        requests:
          cpu: 50m
          memory: 16Mi
        limits:
          cpu: "2"
          memory: 256Mi
