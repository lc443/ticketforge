name: Pull request quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'sprint-*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · Java 21 tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Start integration dependencies
        run: >-
          docker compose -p ticketforge-ci
          -f infrastructure/docker/docker-compose.yml
          -f infrastructure/docker/docker-compose.ci.yml
          up -d --wait postgres redis kafka

      - name: Run the complete backend test suite on Java 21
        run: >-
          docker run --rm --network ticketforge-ci_default
          -e DB_URL=jdbc:postgresql://postgres:5432/ticketforge
          -e DB_USERNAME=postgres
          -e DB_PASSWORD=postgres
          -e REDIS_HOST=redis
          -e REDIS_PORT=6379
          -e KAFKA_BOOTSTRAP_SERVERS=kafka:9092
          -v "$PWD/backend:/workspace"
          -w /workspace
          eclipse-temurin:21-jdk
          ./mvnw -B test

      - name: Capture dependency logs after a failure
        if: failure()
        run: >-
          docker compose -p ticketforge-ci
          -f infrastructure/docker/docker-compose.yml
          -f infrastructure/docker/docker-compose.ci.yml
          logs --tail=200 postgres redis kafka

      - name: Remove integration dependencies
        if: always()
        run: >-
          docker compose -p ticketforge-ci
          -f infrastructure/docker/docker-compose.yml
          -f infrastructure/docker/docker-compose.ci.yml
          down --volumes

  frontend:
    name: Frontend · Node 22 production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install from the lockfile and build
        run: >-
          docker run --rm
          -v "$PWD/frontend:/workspace"
          -w /workspace
          node:22-alpine
          sh -c 'npm ci && npm run build'

  container-builds:
    name: Containers · reproducible builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build the API deployment artifact
        run: >-
          docker build
          -f infrastructure/docker/Dockerfile.api
          -t ticketforge-api:${{ github.sha }}
          .

      - name: Build the frontend deployment artifact
        run: >-
          docker build
          -f infrastructure/docker/Dockerfile.frontend
          -t ticketforge-frontend:${{ github.sha }}
          .

      - name: Build the API gateway deployment artifact
        run: >-
          docker build
          -f infrastructure/docker/Dockerfile.gateway
          -t ticketforge-gateway:${{ github.sha }}
          .

      - name: Scan the API image for fixable high-risk vulnerabilities
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v trivy-cache:/root/.cache/trivy
          aquasec/trivy:0.58.2
          image
          --scanners vuln
          --ignore-unfixed
          --severity HIGH,CRITICAL
          --exit-code 1
          ticketforge-api:${{ github.sha }}

      - name: Scan the frontend image for fixable high-risk vulnerabilities
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v trivy-cache:/root/.cache/trivy
          aquasec/trivy:0.58.2
          image
          --scanners vuln
          --ignore-unfixed
          --severity HIGH,CRITICAL
          --exit-code 1
          ticketforge-frontend:${{ github.sha }}

      - name: Scan the API gateway image for fixable high-risk vulnerabilities
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v trivy-cache:/root/.cache/trivy
          aquasec/trivy:0.58.2
          image
          --scanners vuln
          --ignore-unfixed
          --severity HIGH,CRITICAL
          --exit-code 1
          ticketforge-gateway:${{ github.sha }}

      - name: Export the verified images for trusted publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >-
          docker save
          --output ticketforge-images.tar
          ticketforge-api:${{ github.sha }}
          ticketforge-frontend:${{ github.sha }}
          ticketforge-gateway:${{ github.sha }}

      - name: Hand the exact verified images to the publication job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-container-images
          path: ticketforge-images.tar
          retention-days: 1
          compression-level: 0

  publish:
    name: Release · GHCR images and provenance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, container-builds]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download the verified image archive
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: verified-container-images

      - name: Load the exact images that passed the security gates
        run: docker load --input ticketforge-images.tar

      - name: Authenticate to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push immutable commit tags and capture registry digests
        id: push
        env:
          API_IMAGE: ghcr.io/${{ github.repository_owner }}/ticketforge-api:sha-${{ github.sha }}
          FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/ticketforge-frontend:sha-${{ github.sha }}
          GATEWAY_IMAGE: ghcr.io/${{ github.repository_owner }}/ticketforge-gateway:sha-${{ github.sha }}
        run: |
          docker tag "ticketforge-api:${{ github.sha }}" "$API_IMAGE"
          docker tag "ticketforge-frontend:${{ github.sha }}" "$FRONTEND_IMAGE"
          docker tag "ticketforge-gateway:${{ github.sha }}" "$GATEWAY_IMAGE"
          docker push "$API_IMAGE"
          docker push "$FRONTEND_IMAGE"
          docker push "$GATEWAY_IMAGE"

          api_reference=$(docker image inspect "$API_IMAGE" --format '{{index .RepoDigests 0}}')
          frontend_reference=$(docker image inspect "$FRONTEND_IMAGE" --format '{{index .RepoDigests 0}}')
          gateway_reference=$(docker image inspect "$GATEWAY_IMAGE" --format '{{index .RepoDigests 0}}')
          echo "api-digest=${api_reference#*@}" >> "$GITHUB_OUTPUT"
          echo "frontend-digest=${frontend_reference#*@}" >> "$GITHUB_OUTPUT"
          echo "gateway-digest=${gateway_reference#*@}" >> "$GITHUB_OUTPUT"

      - name: Attest the API image provenance
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/ticketforge-api
          subject-digest: ${{ steps.push.outputs.api-digest }}
          push-to-registry: true

      - name: Attest the frontend image provenance
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/ticketforge-frontend
          subject-digest: ${{ steps.push.outputs.frontend-digest }}
          push-to-registry: true

      - name: Attest the API gateway image provenance
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/ticketforge-gateway
          subject-digest: ${{ steps.push.outputs.gateway-digest }}
          push-to-registry: true
