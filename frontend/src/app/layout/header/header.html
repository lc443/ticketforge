<header class="header">
  <a class="brand" routerLink="/" (click)="closeMenu()">
    <span class="brand-mark">TF</span>

    <div>
      <strong>TicketForge</strong>
      <span>Architecture Lab</span>
    </div>
  </a>

  <button
    class="menu-toggle"
    type="button"
    aria-controls="primary-navigation"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-label]="menuOpen() ? 'Close navigation menu' : 'Open navigation menu'"
    (click)="toggleMenu()"
  >
    <span class="menu-icon" [class.open]="menuOpen()" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </span>
  </button>

  <nav id="primary-navigation" class="nav" [class.open]="menuOpen()" aria-label="Primary navigation">
    <a
      routerLink="/events"
      routerLinkActive="active"
      (click)="closeMenu()"
    >
      Events
    </a>

    <a
      routerLink="/reservations"
      routerLinkActive="active"
      (click)="closeMenu()"
    >
      Reservations
    </a>

    <a
      routerLink="/labs"
      routerLinkActive="active"
      (click)="closeMenu()"
    >
      Labs
    </a>

    <a
      routerLink="/roadmap"
      routerLinkActive="active"
      class="roadmap-link"
      (click)="closeMenu()"
    >
      Roadmap
    </a>

    <button
      class="theme-toggle"
      type="button"
      (click)="theme.toggle()"
      [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
      [attr.title]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
    >
      <span aria-hidden="true">{{ theme.isDark() ? '☀' : '☾' }}</span>
      <span class="theme-label">{{ theme.isDark() ? 'Light' : 'Dark' }}</span>
    </button>

    @if (auth.isLoggedIn()) {
      <span class="auth-email">{{ auth.email() }}</span>
      <button class="auth-action" type="button" (click)="logout()">Sign Out</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active" class="auth-action" (click)="closeMenu()">Sign In</a>
    }
  </nav>
</header>
